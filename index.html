<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111b"><link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png"><title>交易點子生成器 V2</title>
<style>
:root{--bg:#07111b;--card:#0f1b28;--card2:#142335;--line:#24384e;--text:#eef6ff;--muted:#91a9bf;--blue:#28a9ff;--green:#43dc91;--red:#ff6f7d;--amber:#ffd166}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#06101a,#09131e);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.wrap{max-width:980px;margin:auto;padding:18px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:5px 0 18px}h1{font-size:26px;margin:0}.muted{color:var(--muted)}.ver{font-size:12px;border:1px solid var(--line);padding:7px 10px;border-radius:99px;color:#7dd3fc}
.panel,.idea{background:rgba(15,27,40,.96);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1.3fr .8fr .8fr .7fr;gap:9px}
label{font-size:11px;color:var(--muted);display:block;margin-bottom:5px}input,select,button{width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);background:#0a1521;color:var(--text);font-size:14px}
button{font-weight:850;cursor:pointer}.primary{border:0;background:linear-gradient(120deg,#16a9ed,#2563eb)}.secondary{background:#152437}.actions{display:grid;grid-template-columns:1fr 180px;gap:9px;margin-top:10px}
.market{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:12px 0}.stat{padding:12px;border-radius:14px;background:var(--card2);border:1px solid var(--line)}.stat span{font-size:11px;color:var(--muted)}.stat b{display:block;margin-top:3px}
#status{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}.spinner{display:none;margin:22px auto;width:38px;height:38px;border:4px solid #1b3145;border-top-color:#38bdf8;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
.top{display:flex;justify-content:space-between;align-items:center}.name{font-size:18px;font-weight:900}.long{color:var(--green)}.short{color:var(--red)}.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:12px 0}.lv{background:#091520;border:1px solid #1d3042;border-radius:10px;padding:9px}.lv small{display:block;color:var(--muted);font-size:10px}.lv b{font-size:14px}
.score{height:7px;background:#172a3b;border-radius:99px;overflow:hidden;margin-top:8px}.score i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#38bdf8);width:0}.reason{font-size:13px;line-height:1.65;color:#d6e1eb}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.tag{font-size:10px;background:#17283a;padding:5px 8px;border-radius:99px;color:#b9cde0}
.empty{text-align:center;padding:34px 15px;color:var(--muted)}.warning{font-size:11px;line-height:1.55;color:#9db0c2;padding:11px;border:1px solid var(--line);border-radius:12px;background:#0c1722}
@media(max-width:720px){.grid{grid-template-columns:1fr 1fr}.market{grid-template-columns:1fr 1fr}.levels{grid-template-columns:1fr 1fr}.actions{grid-template-columns:1fr}header{align-items:flex-start}}
</style></head><body><div class="wrap">
<header><div><h1>交易點子生成器</h1><div class="muted">V2 · 掃描 → 評分 → 交易計畫</div></div><div class="ver">PWA V2</div></header>
<div class="panel">
<div class="grid">
<div><label>掃描範圍</label><input id="scope" value="全台股" placeholder="全台股 / 半導體 / 2330"></div>
<div><label>市場</label><select id="market"><option>台股</option><option>美股</option><option>加密貨幣</option></select></div>
<div><label>週期</label><select id="period"><option>短波段 2–10日</option><option>當沖</option><option>波段 2–8週</option></select></div>
<div><label>最低 R:R</label><select id="rr"><option>2.0</option><option>2.5</option><option>3.0</option></select></div>
</div>
<div class="actions"><button class="primary" onclick="scan()">🔍 掃描今日市場</button><button class="secondary" onclick="save()">☆ 收藏本次條件</button></div>
<div id="status">V2 已改成直接顯示交易卡片。尚未設定資料 API 時會進入「資料源設定」狀態，不會捏造即時行情。</div>
</div>
<div class="market"><div class="stat"><span>輸出</span><b>5 個候選</b></div><div class="stat"><span>最低風報比</span><b id="rrs">2.0</b></div><div class="stat"><span>模型</span><b>技術＋基本</b></div><div class="stat"><span>原則</span><b>先風控</b></div></div>
<div class="spinner" id="spin"></div><div id="results"><div class="panel empty">按「掃描今日市場」開始。<br>下一階段接上行情 API 後，這裡會直接出現 5 張交易機會卡。</div></div>
<div class="warning">此工具用於整理市場資訊與交易計畫，不保證勝率或報酬。進場區、停損與目標價必須以可靠的最新行情計算；若資料源未連線，系統不產生虛構價位。</div>
</div>
<script>
const $=id=>document.getElementById(id);
function save(){localStorage.setItem('tradePrefs',JSON.stringify({scope:$('scope').value,market:$('market').value,period:$('period').value,rr:$('rr').value}));$('status').textContent='已收藏這組掃描條件到手機。'}
function load(){try{let p=JSON.parse(localStorage.getItem('tradePrefs'));if(p){Object.keys(p).forEach(k=>$(k)&&($(k).value=p[k]))}}catch(e){} $('rrs').textContent=$('rr').value}
async function scan(){
 $('rrs').textContent=$('rr').value;$('spin').style.display='block';$('results').innerHTML='';$('status').textContent='正在檢查市場資料來源…';
 await new Promise(r=>setTimeout(r,650));$('spin').style.display='none';
 $('results').innerHTML=`<div class="panel"><div class="top"><div><div class="name">需要接上行情 API</div><div class="muted">前端 V2 已完成；目前不以假資料產生 5 檔。</div></div><b style="color:var(--amber)">SETUP</b></div>
 <div class="reason" style="margin-top:12px">下一步只差資料層：取得上市/上櫃股票清單、OHLCV 歷史行情、最新成交價與基本面資料，再由瀏覽器或後端計算均線、量能、ATR、支撐壓力與 R:R，最後把前 5 名填進交易卡。</div>
 <div class="tags"><span class="tag">OHLCV</span><span class="tag">MA20/60</span><span class="tag">成交量</span><span class="tag">ATR</span><span class="tag">基本面</span></div></div>`;
 $('status').textContent='V2 介面正常。資料 API 尚未連線，因此沒有產生虛構的今日進場價。';
}
$('rr').addEventListener('change',()=> $('rrs').textContent=$('rr').value);
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js');
load();
</script></body></html>
